# Rule text, one entry per named guard conjunct in packages/models/src/paxos/model.ts.
# The justification generator (DESIGN.md §10.5) splices `short` into the one-line
# verdict and `text` into the explanation. Conjunct ids here MUST match the ids
# in the model; the build fails if any id is missing.
#
# HOUSE RULE: no notation reaches the reader. No "ballot b", no "value v", no
# "phase 1a / 1b / 2a / 2b". Say "the ballot it promised", "the proposed value",
# "the promise request". The ids are for us; the prose is for a person who has
# never seen the protocol written down.
#
# TODO(Murat): review all of this text.
status: draft

rules:
  phase1a.noGaps:
    short: ballots must be used in order, with no gaps
    text: >-
      A proposer may only start a ballot if the ballot numbered one below it has
      already been started. This is NOT a Paxos rule. Paxos places no ordering
      constraint on ballot numbers at all: any proposer may pick any ballot
      number it likes, at any time, and gaps are entirely normal.

  phase1b.requestExists:
    short: there must be a request to respond to
    text: >-
      An acceptor only promises a ballot that some proposer actually asked it
      about. It does not promise ballots nobody has raised.

  phase1b.newer:
    short: the ballot must be higher than anything already promised
    text: >-
      An acceptor promises a ballot only if that ballot is strictly higher than
      the highest one it has already promised. Having promised, it never goes
      back and promises something lower. A promise that did not bind would be
      worth nothing.

  phase2a.noPriorProposal:
    short: a ballot may carry at most one proposal
    text: >-
      A proposer makes at most one proposal per ballot. If two different values
      could be proposed under the same ballot number, two different values could
      both be accepted by a majority at that ballot, and the acceptors would have
      agreed on two things at once.

  phase2a.quorumPromised:
    short: a majority must have promised this ballot
    text: >-
      Before proposing, the proposer must have collected promises for this ballot
      from a majority of the acceptors. The point is not the count. It is that
      any two majorities share at least one acceptor, so this majority overlaps
      with any majority that might already have agreed on something — and that
      shared acceptor is what forces the proposer to hear about it.

  phase2a.someOnePromised:
    short: at least one acceptor has promised this ballot
    text: >-
      One promise is enough to start proposing. This is NOT a Paxos rule. A
      single acceptor's promise carries no overlap guarantee: the one acceptor
      that answered may be the only one that knows nothing about a value the
      other two already agreed on.

  phase2a.unanimousPromised:
    short: every acceptor must have promised this ballot
    text: >-
      All three acceptors, rather than a majority, must promise before a value may
      be proposed. This is NOT a Paxos rule, and requiring it would throw away
      the fault tolerance that is the whole reason for running Paxos: one
      crashed acceptor would block all progress forever.

  phase2a.highestReported:
    short: propose the value reported from the highest ballot
    text: >-
      If any acceptor in the majority reported something it had already accepted, the proposer is
      not free to choose. It must propose the value that was reported together
      with the highest ballot number among those reports. This single rule is
      what makes Paxos safe: it is how a value that may already have been agreed
      on gets carried forward into every later attempt.

  phase2a.anyReported:
    short: propose any value that was reported
    text: >-
      Any previously accepted value may be proposed again. This is NOT a Paxos
      rule. Among the things reported, only the one from the highest ballot could
      possibly be the agreed value; proposing an older one can overwrite a
      decision that has already been made.

  phase2b.proposalExists:
    short: there must be a proposal to accept
    text: >-
      An acceptor only accepts a value that some proposer actually proposed for
      that ballot. It cannot accept something nobody put forward.

  phase2b.ballotAtLeastPromised:
    short: the ballot must be at least as high as the promise
    text: >-
      An acceptor accepts in a ballot only if that ballot is the same as, or higher
      than, the highest ballot it has promised. The same as matters: the normal
      path through the protocol is an acceptor promising a ballot and then accepting
      in that very ballot.

  phase2b.ballotStrictlyGreater:
    short: the ballot must be strictly higher than the promise
    text: >-
      An acceptor only accepts in a ballot strictly higher than the one it
      promised. This is NOT a Paxos rule, and it would stop the protocol dead:
      an acceptor could never accept in the very ballot it just promised, which is
      exactly what it is supposed to do.

  phase2b.neverVoted:
    short: an acceptor accepts at most once, ever
    text: >-
      Having accepted once, an acceptor never accepts again. This is NOT a Paxos rule.
      An acceptor may accept many times, in increasing ballots. What keeps that
      safe is not the acceptor refusing to change its mind, but the rule that
      forces later proposers to carry the same value forward.

# Effect pseudo-rules, reported when a step is allowed to happen but the result
# shown is not what Paxos would actually record. Keyed by "<Action>.effect".
effects:
  Phase1a.effect:
    short: a request to promise carries only the ballot number
    text: When a proposer asks for promises, it says which ballot and nothing else.

  Phase1b.effect:
    short: a promise reports what the acceptor last accepted
    text: >-
      A promise is not a bare acknowledgement. It carries the ballot and value of
      the last value the acceptor accepted, or says it has not accepted anything. It also raises
      the acceptor's promised ballot. Both halves matter: the report is how an
      already-agreed value is discovered, and the raise is what makes the promise
      binding.

  Phase2a.effect:
    short: a proposal names the ballot and the value
    text: A proposal says which ballot it belongs to and which value is being put forward.

  Phase2b.effect:
    short: accepting records the ballot and value, and raises the promise
    text: >-
      When an acceptor accepts a value in some ballot, it records that ballot
      as both its promised ballot and the ballot of its last acceptance, records the
      value, and announces it so everyone can see.
