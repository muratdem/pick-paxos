name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

# Required for actions/deploy-pages to mint an OIDC token.
permissions:
  contents: read
  pages: write
  id-token: write

# One deploy at a time; don't cancel a running one half-way.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      # Regenerate rather than trusting the committed banks, so a stale commit
      # cannot ship questions that no longer match the models.
      - name: Build question banks
        run: npm run build:banks

      - name: Verify the banks still diagnose
        run: npm run harness

      - name: Build site
        # Pages serves a project site from /<repo>/, so Vite's base must match.
        env:
          DYP_BASE: /${{ github.event.repository.name }}/
        run: npm run build -w @dyp/web

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: packages/web/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
